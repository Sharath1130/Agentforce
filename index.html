<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: white;
    }

    /* Navbar */

    .navbar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 15px 25px;
      gap: 18px;
      font-size: 14px;
    }

    .navbar a {
      text-decoration: none;
      color: #202124;
    }

    .navbar a:hover {
      text-decoration: underline;
    }

    .profile {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #4285f4;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      cursor: pointer;
    }

    /* Main */

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-top: -80px;
    }

    .logo {
      font-size: 90px;
      font-weight: bold;
      margin-bottom: 25px;
      user-select: none;
    }

    .blue {
      color: #4285f4;
    }

    .red {
      color: #ea4335;
    }

    .yellow {
      color: #fbbc05;
    }

    .green {
      color: #34a853;
    }

    /* Search Box */

    .search-box {
      width: 90%;
      max-width: 580px;
      border: 1px solid #dfe1e5;
      border-radius: 30px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: 0.3s;
    }

    .search-box:hover {
      box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
    }

    .search-box input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 16px;
    }

    .search-icon {
      color: gray;
      font-size: 18px;
    }

    /* Buttons */

    .buttons {
      margin-top: 30px;
      display: flex;
      gap: 12px;
    }

    .buttons button {
      padding: 10px 18px;
      border: 1px solid #f8f9fa;
      background: #f8f9fa;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .buttons button:hover {
      border: 1px solid #dadce0;
      box-shadow: 0 1px 1px rgba(0,0,0,0.1);
    }

    /* Footer */

    .footer {
      background: #f2f2f2;
      padding: 15px 30px;
      font-size: 14px;
      color: #70757a;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .footer-links {
      display: flex;
      gap: 20px;
    }

    .footer a {
      text-decoration: none;
      color: #70757a;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .logo {
        font-size: 60px;
      }

      .footer {
        flex-direction: column;
        gap: 10px;
        text-align: center;
      }

      .footer-links {
        justify-content: center;
      }
    }
  </style>
</head>

<body>

  <!-- Navbar -->

  <div class="navbar">
    <a href="#">Gmail</a>
    <a href="#">Images</a>
    <div class="profile">U</div>
  </div>

  <!-- Main -->

  <div class="main">

    <!-- Google Logo -->

    <div class="logo">
      <span class="blue">G</span>
      <span class="red">o</span>
      <span class="yellow">o</span>
      <span class="blue">g</span>
      <span class="green">l</span>
      <span class="red">e</span>
    </div>

    <!-- Search -->

    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" placeholder="Search Google or type a URL">
    </div>

    <!-- Buttons -->

    <div class="buttons">
      <button>Google Search</button>
      <button>I'm Feeling Lucky</button>
    </div>

  </div>

  <!-- Footer -->

  <div class="footer">

    <div class="footer-links">
      <a href="#">About</a>
      <a href="#">Advertising</a>
      <a href="#">Business</a>
    </div>

    <div class="footer-links">
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
      <a href="#">Settings</a>
    </div>


  </div>
