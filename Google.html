<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Clone</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: flex-end;
      padding: 15px 25px;
      gap: 20px;
    }

    .header a {
      text-decoration: none;
      color: black;
      font-size: 14px;
    }

    /* Main Section */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* Google Logo */
    .logo {
      font-size: 80px;
      font-weight: bold;
    }

    .blue { color: #4285F4; }
    .red { color: #EA4335; }
    .yellow { color: #FBBC05; }
    .green { color: #34A853; }

    /* Search Box */
    .search-box {
      margin-top: 20px;
    }

    .search-box input {
      width: 500px;
      padding: 12px 20px;
      border: 1px solid #ccc;
      border-radius: 25px;
      outline: none;
      font-size: 16px;
    }

    /* Buttons */
    .buttons {
      margin-top: 20px;
    }

    .buttons button {
      padding: 10px 20px;
      margin: 5px;
      border: none;
      background: #f2f2f2;
      cursor: pointer;
      border-radius: 4px;
    }

    .buttons button:hover {
      border: 1px solid #ccc;
    }

    /* Footer */
    .footer {
      background: #f2f2f2;
      padding: 15px;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <!-- Header -->
  <div class="header">
    <a href="#">Gmail</a>
    <a href="#">Images</a>
  </div>

  <!-- Main -->
  <div class="main">

    <!-- Logo -->
    <div class="logo">
      <span class="blue">G</span>
      <span class="red">o</span>
      <span class="yellow">o</span>
      <span class="blue">g</span>
      <span class="green">l</span>
      <span class="red">e</span>
    </div>

    <!-- Search -->
    <div class="search-box">
      <input type="text" placeholder="Search Google or type a URL">
    </div>

    <!-- Buttons -->
    <div class="buttons">
      <button>Google Search</button>
      <button>I'm Feeling Lucky</button>
    </div>

  </div>

  <!-- Footer -->
  <div class="footer">
    Google Homepage
  </div>
