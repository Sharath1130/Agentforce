<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Google Clone</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #fff;
      color: #202124;
    }

    /* Header */
    header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 15px 25px;
      gap: 20px;
      font-size: 14px;
    }

    header a {
      text-decoration: none;
      color: #202124;
    }

    header a:hover {
      text-decoration: underline;
    }

    .profile {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      background: #4285f4;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      cursor: pointer;
    }

    /* Main */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-top: -80px;
    }

    .logo {
      font-size: 90px;
      font-weight: bold;
      margin-bottom: 30px;
      letter-spacing: -5px;
    }

    .logo span:nth-child(1) { color: #4285f4; }
    .logo span:nth-child(2) { color: #ea4335; }
    .logo span:nth-child(3) { color: #fbbc05; }
    .logo span:nth-child(4) { color: #4285f4; }
    .logo span:nth-child(5) { color: #34a853; }
    .logo span:nth-child(6) { color: #ea4335; }

    .search-box {
      width: 90%;
      max-width: 600px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 14px 50px;
      border: 1px solid #dcdcdc;
      border-radius: 30px;
      font-size: 16px;
      outline: none;
      transition: 0.3s;
    }

    .search-box input:hover,
    .search-box input:focus {
      box-shadow: 0 1px 6px rgba(32,33,36,0.28);
      border-color: transparent;
    }

    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: gray;
      font-size: 18px;
    }

    .buttons {
      margin-top: 30px;
      display: flex;
      gap: 15px;
    }

    .buttons button {
      padding: 10px 18px;
      border: 1px solid #f8f9fa;
      background: #f8f9fa;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }

    .buttons button:hover {
      border: 1px solid #dadce0;
      box-shadow: 0 1px 1px rgba(0,0,0,0.1);
    }

    /* Footer */
    footer {
      background: #f2f2f2;
      padding: 15px 30px;
      font-size: 14px;
    }

    .footer-top {
      padding-bottom: 10px;
      border-bottom: 1px solid #dadce0;
    }

    .footer-bottom {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      padding-top: 10px;
    }

    .footer-links {
      display: flex;
      gap: 20px;
    }

    .footer-links a {
      text-decoration: none;
      color: #70757a;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }

    @media(max-width: 600px) {
      .logo {
        font-size: 60px;
      }

      .footer-bottom {
        flex-direction: column;
        gap: 10px;
      }
    }
  </style>
</head>

<body>

  <!-- Header -->
  <header>
    <a href="#">Gmail</a>
    <a href="#">Images</a>
    <div class="profile">U</div>
  </header>

  <!-- Main -->
  <div class="main">

    <div class="logo">
      <span>G</span>
      <span>o</span>
      <span>o</span>
      <span>g</span>
      <span>l</span>
      <span>e</span>
    </div>

    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" placeholder="Search Google or type a URL">
    </div>

    <div class="buttons">
      <button>Google Search</button>
      <button>I'm Feeling Lucky</button>
    </div>

  </div>

  <!-- Footer -->
  <footer>
    <div class="footer-top">
      India
    </div>

    <div class="footer-bottom">
      <div class="footer-links">
        <a href="#">About</a>
        <a href="#">Advertising</a>
        <a href="#">Business</a>
      </div>

      <div class="footer-links">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Settings</a>
      </div>
    </div>
  </footer>
